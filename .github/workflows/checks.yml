name: Windows source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - run: python -m pip install -r WhisperBrain/requirements.lock.txt -r WhisperAccounts/requirements.lock.txt
      - run: python -m unittest discover -s WhisperBrain -p 'test_*.py' -v
      - run: python -m unittest discover -s WhisperAccounts/tests -p 'test_*.py' -v
      - run: dotnet run --project tests/WhisperClient.CoreTests/WhisperClient.CoreTests.csproj
      - run: dotnet build WhisperClient/WhisperClient.csproj
