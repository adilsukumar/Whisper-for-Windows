<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="title desc"><title id="title">status</title><desc id="desc">Whisper for Windows documentation artwork. status</desc><style>@keyframes glow{50%{opacity:.38}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes frequency{50%{transform:scaleY(.35)}}.glow{animation:glow 5s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}.frequency{transform-box:fill-box;transform-origin:center;animation:frequency 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.glow,.float,.frequency{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><g transform="translate(2 2) scale(0.9545454545454546)" ><path d="M5 6h32v34H5zM12 16l4 4 8-8M12 29h17" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>