<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="435" viewBox="0 0 1120 435" role="img" aria-labelledby="title desc"><title id="title">Ask by voice or text. Share context with consent. Receive guidance. Pause or cancel.</title><desc id="desc">Whisper for Windows documentation artwork. Ask by voice or text. Share context with consent. Receive guidance. Pause or cancel.</desc><style>@keyframes glow{50%{opacity:.38}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes frequency{50%{transform:scaleY(.35)}}.glow{animation:glow 5s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}.frequency{transform-box:fill-box;transform-origin:center;animation:frequency 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.glow,.float,.frequency{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="195" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 36) scale(0.9545454545454546)" ><path d="M20 5a6 6 0 0 1 6 6v12a6 6 0 0 1-12 0V11a6 6 0 0 1 6-6M8 21v2a12 12 0 0 0 24 0v-2M20 35v6M13 41h14" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="106" y="65" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F3D962" font-weight="600" >ASK NATURALLY</text><text x="46" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Voice or text, without leaving your</text><text x="46" y="150" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >workflow.</text><rect x="574" y="12" width="522" height="195" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 36) scale(0.9545454545454546)" ><path d="M5 7h32v24H5zM21 31v8M13 39h16M11 14h10M11 21h16" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="656" y="65" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F3D962" font-weight="600" >ADD CONTEXT</text><text x="596" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Screen sharing is off by default. You</text><text x="596" y="150" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >decide when to share.</text><rect x="24" y="222" width="522" height="195" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 246) scale(0.9545454545454546)" ><path d="M7 4l27 21-13 1-5 13zM30 4v6M36 12h6" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="106" y="275" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F3D962" font-weight="600" >GET GUIDANCE</text><text x="46" y="326" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Spoken answers, native overlays and</text><text x="46" y="360" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >on-screen annotations.</text><rect x="574" y="222" width="522" height="195" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 246) scale(0.9545454545454546)" ><path d="M4 10h34M4 22h34M4 34h34M12 6v8M29 18v8M17 30v8" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="656" y="275" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F3D962" font-weight="600" >STAY IN CONTROL</text><text x="596" y="326" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Pause, cancel an active turn, or</text><text x="596" y="360" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >dismiss the response.</text></svg>