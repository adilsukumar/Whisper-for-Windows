<svg xmlns="http://www.w3.org/2000/svg" width="640" height="498" viewBox="0 0 640 498" role="img" aria-labelledby="title desc"><title id="title">Prototype hotkeys: hold Ctrl+Space to talk, Ctrl+Shift+Space for text input, Escape to dismiss.</title><desc id="desc">Whisper for Windows documentation artwork. Prototype hotkeys: hold Ctrl+Space to talk, Ctrl+Shift+Space for text input, Escape to dismiss.</desc><style>@keyframes glow{50%{opacity:.38}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes frequency{50%{transform:scaleY(.35)}}.glow{animation:glow 5s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}.frequency{transform-box:fill-box;transform-origin:center;animation:frequency 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.glow,.float,.frequency{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="145" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(42 30) scale(0.7727272727272727)" ><path d="M5 9h35v27H5zM11 16h2M19 16h2M27 16h2M11 23h2M19 23h2M27 23h2M13 30h17" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="90" y="59" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >Ctrl + Space</text><text x="46" y="116" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >Hold to talk</text><rect x="24" y="172" width="592" height="145" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(42 190) scale(0.7727272727272727)" ><path d="M5 9h35v27H5zM11 16h2M19 16h2M27 16h2M11 23h2M19 23h2M27 23h2M13 30h17" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="90" y="219" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >Ctrl + Shift + Space</text><text x="46" y="276" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >Open text input</text><rect x="24" y="332" width="592" height="145" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(42 350) scale(0.7727272727272727)" ><path d="M5 9h35v27H5zM11 16h2M19 16h2M27 16h2M11 23h2M19 23h2M27 23h2M13 30h17" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="90" y="379" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >Escape</text><text x="46" y="436" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >Dismiss the response</text></svg>