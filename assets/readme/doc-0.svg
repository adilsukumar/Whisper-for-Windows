<svg xmlns="http://www.w3.org/2000/svg" width="520" height="136" viewBox="0 0 520 136" role="img" aria-labelledby="title desc"><title id="title">Product vision. The intended experience</title><desc id="desc">Whisper for Windows documentation artwork. Product vision. The intended experience</desc><style>@keyframes glow{50%{opacity:.38}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes frequency{50%{transform:scaleY(.35)}}.glow{animation:glow 5s ease-in-out infinite}.float{animation:float 7s ease-in-out infinite}.frequency{transform-box:fill-box;transform-origin:center;animation:frequency 2.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.glow,.float,.frequency{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="2" y="2" width="516" height="132" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(20 24) scale(0.9090909090909091)" ><path d="M22 3l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="80" y="49" font-family="Bahnschrift, Arial, sans-serif" font-size="28" fill="#F3D962" font-weight="600" >Product vision</text><text x="21" y="103" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#BCFCF6" font-weight="400" >The intended experience</text></svg>