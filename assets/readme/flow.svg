<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="t d"><title id="t">Ask by voice or text, provide consented context, receive guidance. Conceptual system flow.</title><desc id="d">Whisper for Windows README artwork, a conceptual signal illustration rather than a product screenshot.</desc><defs><linearGradient id="signal"><stop stop-color="#BCFCF6"/><stop offset=".5" stop-color="#FF4081"/><stop offset="1" stop-color="#A783F7"/></linearGradient><linearGradient id="type" x2="1" y2="1"><stop stop-color="#F8F8F3"/><stop offset=".6" stop-color="#BCFCF6"/><stop offset="1" stop-color="#A783F7"/></linearGradient></defs><style>@keyframes voice{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes point{50%{opacity:.2;transform:scale(.86)}}.voice{transform-box:fill-box;transform-origin:center;animation:voice 2.6s ease-in-out infinite}.point{transform-box:fill-box;transform-origin:center;animation:point 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.voice,.point{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="53" fill="#FF4081" font-family="Bahnschrift, Arial, sans-serif" font-size="22" font-weight="600" >FROM A QUESTION TO ON-SCREEN GUIDANCE</text><rect x="32" y="88" width="325" height="130" rx="18" fill="#141320" stroke="#343044"/><text x="52" y="129" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" >ASK</text><text x="52" y="176" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" >Voice or text</text><circle cx="328" cy="120" r="7" fill="#A783F7" class="point" style="animation-delay:-0s"/><rect x="397" y="88" width="325" height="130" rx="18" fill="#141320" stroke="#343044"/><text x="417" y="129" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" >CONTEXT</text><text x="417" y="176" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" >Consented screen input</text><circle cx="693" cy="120" r="7" fill="#A783F7" class="point" style="animation-delay:-1s"/><rect x="762" y="88" width="325" height="130" rx="18" fill="#141320" stroke="#343044"/><text x="782" y="129" fill="#F3D962" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="600" >GUIDE</text><text x="782" y="176" fill="#BCFCF6" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" >An answer and annotations</text><circle cx="1058" cy="120" r="7" fill="#A783F7" class="point" style="animation-delay:-2s"/></svg>